name: Monthly CBDC data

on:
  schedule:
    - cron: '0 7 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Ingest and build dataset
        run: npm run update:data
        env:
          CBDC_INGEST_URL: ${{ secrets.CBDC_INGEST_URL }}

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(data): refresh CBDC dataset'
          title: 'chore(data): automated CBDC data update'
          body: |
            Scheduled run of `npm run update:data` (ingest + merge + validate).

            - Set repository secret `CBDC_INGEST_URL` to a JSON URL that returns `{ "countries": [...] }` patches, or leave unset to merge only from `data/incoming/*.json` committed in repo.
            - Review `public/cbdc-data.json` before merge.
          branch: automated/cbdc-data-${{ github.run_id }}
          delete-branch: true
